# Coolify-Fassung (AR-Infra): keine Host-Ports (Routing nur via Traefik),
# kein Dev-Bind-Mount, Secrets aus Coolify-Env. Vgl. polln-install-plan.md §4.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: pollndb
      MYSQL_USER: pollnuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - polln-db:/var/lib/mysql

  web:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: polln.settings.prod_settings
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL: https://poll.docmoritz.academy
      ALLOWED_HOSTS: poll.docmoritz.academy
      CSRF_TRUSTED_ORIGINS: https://poll.docmoritz.academy
      MYSQL_ENGINE: mysql.connector.django
      MYSQL_NAME: pollndb
      MYSQL_USER: pollnuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
    depends_on:
      - db
    labels:
      # msc-security-headers@file: zentrale AR-Middleware (HSTS, nosniff, XFO, Referrer-Policy)
      - traefik.http.routers.https-0-yjr84bm6cz4z7ar72z3adsu4-web.middlewares=gzip,msc-security-headers@file

volumes:
  polln-db:
